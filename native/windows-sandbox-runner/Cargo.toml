[package]
name = "kite-windows-runner"
version = "0.7.1"
edition = "2021"
description = "Windows native launcher for Kite Code Shell sandbox backends"
license = "MIT"

[lib]
name = "kite_windows_runner"
path = "src/lib.rs"

[[bin]]
name = "kite-windows-runner"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_NetworkManagement_NetManagement",
  "Win32_System_JobObjects",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_IO",
  "Win32_System_SystemInformation",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"

[profile.release]
lto = true
strip = true
