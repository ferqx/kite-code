name: Execution Boundary Artifact Conformance

on:
  pull_request:
    paths:
      - "packages/trajectory/**"
      - "packages/trace-extension-sdk/**"
      - "native/**"
      - "patches/**"
      - "packages/ai/**"
      - "packages/agent/**"
      - "packages/client/**"
      - "packages/ui/**"
      - "apps/service/**"
      - "apps/cli/**"
      - "apps/desktop/**"
      - "apps/web/**"
      - "scripts/ci/logged-shell.ts"
      - "tests/isolated/scripts/ci-logged-shell.test.ts"
      - "scripts/release/**"
      - "scripts/runtime/**"
      - "tests/isolated/unified-agent/**"
      - "tests/fixtures/unified-agent/**"
      - "tests/fixtures/formal-optional-capabilities/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/execution-boundary-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-artifact-conformance:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        name: Prepare Linux native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential bubblewrap
      - if: runner.os == 'Windows'
        name: Prepare installed Windows x64 Native compiler
        run: bun run scripts/release/prepare-windows-native-ci.ts
      - name: Current Files, dispatch, confinement and immutable artifact contracts
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/execution-boundary.log "{0}"
        run: >-
          bun test --parallel=1 --max-concurrency=1
          packages/agent/test/isolated/jobs/confined-shell.test.ts
          packages/agent/test/isolated/files/runtime.test.ts
          packages/agent/test/isolated/execution/authorization-check.test.ts
          apps/service/test/isolated/runtime-assets.test.ts
      - if: runner.os == 'macOS' || runner.os == 'Linux'
        name: Exercise packaged optional capabilities on supported hosts
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/optional-capabilities.log "{0}"
        run: bun test --parallel=1 --max-concurrency=1 tests/isolated/unified-agent/formal-optional-capabilities.test.ts
      - if: runner.os == 'macOS'
        name: Exercise native runtime protection on its owning host
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/native-runtime-protection.log "{0}"
        run: bun test --parallel=1 --max-concurrency=1 tests/isolated/unified-agent/native-runtime-protection.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: execution-boundary-negative-conformance-${{ matrix.os }}
          path: dist/unified-evidence/*.log
          if-no-files-found: error
          overwrite: false
