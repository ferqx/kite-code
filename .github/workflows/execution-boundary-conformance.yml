name: Execution Boundary Artifact Conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/core/config/release-*.ts"
      - "src/core/sandbox/**"
      - "src/core/mcp/**"
      - "src/app/release/**"
      - "src/app/workspace/**"
      - "scripts/release/**"
      - "release/platform-capabilities/**"
      - "tests/release/**"
      - "tests/sandbox/**"
      - "tests/workspace/**"
      - ".github/workflows/execution-boundary-conformance.yml"

permissions:
  contents: read

jobs:
  negative-artifact-conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Boundary and adversarial contracts
        run: >-
          bun test
          tests/policies/protected-path.test.ts
          tests/sandbox/network-boundary.test.ts
          tests/sandbox/network-boundary-concurrency.test.ts
          tests/sandbox/process-tree-limit.test.ts
          tests/sandbox/execution-boundary.test.ts
          tests/workspace/worktree-controller.test.ts
          tests/mcp-transport-boundary.test.ts
          tests/mcp-transport-boundary-concurrency.test.ts
          tests/release/execution-boundary-smoke.test.ts
      - run: bun run release:build
      - run: bun run release:verify
      - run: bun run release:smoke:execution
      - uses: actions/upload-artifact@v4
        with:
          name: execution-boundary-negative-conformance-${{ matrix.os }}
          path: |
            dist/release-synthetic/
            dist/execution-boundary-smoke.json
          if-no-files-found: error
