name: MCP LangChain live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  langchain-docs:
    name: LangChain docs MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KITE_RUN_LIVE_MCP_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:mcp:live
