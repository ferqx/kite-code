name: MCP LangChain live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  langchain-docs:
    name: LangChain docs MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KITE_RUN_LIVE_MCP_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Prepare Linux runtime build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential pkg-config libffi-dev
      - name: Build the Node Agent runtime
        run: bun --cwd=packages/agent run build
      - run: mkdir -p dist/unified-evidence
      - run: node --import ./scripts/tooling/register.mjs scripts/runtime/unified-mcp-live-smoke.ts "--output=${{ github.workspace }}/dist/unified-evidence/mcp-live.json"
      - name: Preserve actual evidence and unsigned candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unified-mcp-live-${{ github.run_id }}
          path: dist/unified-evidence/mcp-live.json
          if-no-files-found: error
          overwrite: false
