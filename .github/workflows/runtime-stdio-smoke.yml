name: Runtime stdio smoke

on:
  pull_request:
    paths:
      - "packages/ai/**"
      - "packages/agent/**"
      - "packages/client/**"
      - "packages/ui/**"
      - "apps/service/**"
      - "apps/cli/**"
      - "apps/desktop/**"
      - "apps/web/**"
      - "scripts/release/**"
      - "scripts/runtime/**"
      - "scripts/ci/**"
      - "tests/isolated/unified-agent/**"
      - "tests/fixtures/unified-agent/**"
      - "tests/fixtures/formal-optional-capabilities/**"
      - "tests/isolated/scripts/ci-logged-shell.test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/runtime-stdio-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parent-owned-child:
    timeout-minutes: 15
    env:
      KITE_EXPECTED_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      KITE_CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.KITE_EXPECTED_CANDIDATE_COMMIT }}
          repository: ${{ env.KITE_CANDIDATE_REPOSITORY }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.3' || '1.4.2' }}
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        name: Prepare Linux native MCP dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential bubblewrap
      - if: runner.os == 'Windows'
        name: Prepare installed Windows x64 Native compiler
        run: bun run scripts/release/prepare-windows-native-ci.ts
      - name: Check native qualification log and exit propagation
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/runtime-stdio-shell.log "{0}"
        run: bun test --parallel=1 --max-concurrency=1 tests/isolated/scripts/ci-logged-shell.test.ts
      - run: bun run test:runtime:stdio
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/runtime-stdio.log "{0}"
      - name: Preserve complete native MCP and paired lifecycle logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-stdio-${{ matrix.os }}
          path: |
            dist/unified-evidence/runtime-stdio-shell.log
            dist/unified-evidence/runtime-stdio.log
          if-no-files-found: error
          retention-days: 14
