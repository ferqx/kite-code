name: Session Log ACL Smoke

on:
  pull_request:
    paths:
      - "src/core/session-logger/**"
      - "src/core/config/paths.ts"
      - "scripts/release/session-log-acl-smoke.ts"
      - ".github/workflows/session-log-acl-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-acl:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run scripts/release/session-log-acl-smoke.ts session-log-acl-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: session-log-acl-${{ matrix.os }}
          path: session-log-acl-evidence.json
          if-no-files-found: error
