name: Session Log ACL Smoke

on:
  pull_request:
    paths:
      - "apps/kite-service/src/session-logger/**"
      - "apps/kite-service/src/config/paths.ts"
      - "scripts/release/session-log-acl-smoke.ts"
      - ".github/workflows/session-log-acl-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-acl:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run scripts/release/session-log-acl-smoke.ts session-log-acl-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: session-log-acl-${{ matrix.os }}
          path: session-log-acl-evidence.json
          if-no-files-found: error
