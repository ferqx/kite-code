name: Session Log ACL Smoke

on:
  pull_request:
    paths:
      - "packages/ai/**"
      - "packages/agent/**"
      - "packages/client/**"
      - "packages/ui/**"
      - "apps/service/**"
      - "apps/cli/**"
      - "apps/desktop/**"
      - "apps/web/**"
      - "scripts/release/**"
      - "scripts/runtime/**"
      - "tests/isolated/unified-agent/**"
      - "tests/fixtures/unified-agent/**"
      - "tests/fixtures/formal-optional-capabilities/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/session-log-acl-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-acl:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun -e "require('node:fs').mkdirSync('dist/unified-evidence',{recursive:true})"
      - run: bun run scripts/runtime/unified-session-log-acl.ts "--output=${{ github.workspace }}/dist/unified-evidence/session-log-acl.json"
      - name: Preserve actual evidence and unsigned candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: session-log-acl-${{ matrix.os }}
          path: dist/unified-evidence/session-log-acl.json
          if-no-files-found: error
          overwrite: false
