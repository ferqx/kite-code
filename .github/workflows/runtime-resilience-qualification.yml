name: Runtime Resilience Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: fault-soak-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 190
    env:
      QUALIFICATION_REPOSITORY: ${{ github.repository }}
      QUALIFICATION_HEAD_SHA: ${{ github.sha }}
      QUALIFICATION_REF: ${{ github.ref }}
      QUALIFICATION_WORKFLOW_REF: ${{ github.workflow_ref }}
      QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QUALIFICATION_RUN_ID: ${{ github.run_id }}
      QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun -e "require('node:fs').mkdirSync('dist/unified-evidence',{recursive:true})"
      - name: Run fixed eight-iteration, sixty-minute qualification
        run: >-
          bun run scripts/runtime/unified-soak.ts
          --profile=qualification
          --output=dist/unified-evidence/runtime-resilience-qualification.json
      - name: Verify complete qualification evidence
        if: always()
        run: bun run scripts/runtime/unified-soak-verify.ts dist/unified-evidence/runtime-resilience-qualification.json
      - name: Preserve actual evidence and unsigned candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-resilience-qualification-${{ github.run_id }}
          path: dist/unified-evidence/runtime-resilience-qualification.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
