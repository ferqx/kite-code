name: Diagnostic Native Conformance Qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# This is a diagnostic transport only.  It has no release authority and never
# receives credentials.  Until an approved protected-CI governance control
# plane supplies an atomic quota reservation, maintainer authorization, and a
# protection witness, each matrix job writes only a fixed blocked record.
jobs:
  native-conformance:
    if: github.repository == 'ferqx/kite-code' && github.ref == 'refs/heads/main'
    name: native-conformance-${{ matrix.distribution_target }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - distribution_target: macos-15-arm64
            target: macos-arm64
            runner: macos-15
            runner_class: macos-15-arm64-github-hosted
          - distribution_target: ubuntu-24.04-x64
            target: linux-x64
            runner: ubuntu-24.04
            runner_class: ubuntu-24.04-x64-github-hosted
          - distribution_target: windows-2025-x64
            target: windows-x64
            runner: windows-2025
            runner_class: windows-2025-x64-github-hosted
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      QUALIFICATION_REPOSITORY: ${{ github.repository }}
      QUALIFICATION_REPOSITORY_ID: ${{ github.repository_id }}
      QUALIFICATION_HEAD_SHA: ${{ github.sha }}
      QUALIFICATION_REF: ${{ github.ref }}
      QUALIFICATION_WORKFLOW: .github/workflows/native-conformance-qualification.yml
      QUALIFICATION_WORKFLOW_REF: ${{ github.workflow_ref }}
      QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QUALIFICATION_RUN_ID: ${{ github.run_id }}
      QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
      QUALIFICATION_RUNNER_CLASS: ${{ matrix.runner_class }}
    steps:
      # Official refs/tags/v4 and refs/tags/v2 commit objects, resolved through
      # the GitHub API on 2026-08-02.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: L2 diagnostic contract and workflow policy
        run: >-
          bun test
          tests/evals/qualification/native-conformance.test.ts
          tests/evals/qualification/native-conformance-workflow.test.ts
          tests/evals/qualification/l2-native-runner.test.ts
          tests/release/standalone-keyring-unavailable.test.ts
      - name: Write governance-preflight metadata-only worker record
        run: >-
          bun run scripts/evals/qualification/run-l2-native-conformance.ts
          --worker-output l2-native-worker.json
          --distribution-target ${{ matrix.distribution_target }}
          --governance-preflight-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l2-native-conformance-${{ matrix.distribution_target }}
          path: l2-native-worker.json
          if-no-files-found: error
          retention-days: 14
