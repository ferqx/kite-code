name: Agent Task Evidence Contract

on:
  workflow_dispatch:
    inputs:
      stage:
        description: D-07 retained attempt count contract
        required: true
        default: pinned_route_or_baseline_change
        type: choice
        options:
          - pinned_route_or_baseline_change
          - release_candidate
      acknowledge_blocked_contract_only:
        description: Produce unsigned, non-production, evidence-ineligible contract artifacts only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  agent-task-evidence-contract:
    if: >-
      github.repository == 'ferqx/kite-code' &&
      inputs.acknowledge_blocked_contract_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENT_TASK_REPOSITORY: ferqx/kite-code
      AGENT_TASK_REPOSITORY_ID: R_kgDOSKbi8g
      AGENT_TASK_HEAD_SHA: ${{ github.sha }}
      AGENT_TASK_REF: ${{ github.ref }}
      AGENT_TASK_WORKFLOW_PATH: .github/workflows/agent-task-evidence.yml
      AGENT_TASK_WORKFLOW_REF: ${{ github.workflow_ref }}
      AGENT_TASK_WORKFLOW_SHA: ${{ github.workflow_sha }}
      AGENT_TASK_RUN_ID: ${{ github.run_id }}
      AGENT_TASK_RUN_ATTEMPT: ${{ github.run_attempt }}
      AGENT_TASK_JOB: agent-task-evidence-contract
      RETAINED_ARTIFACT_NAME: agent-task-retained-input-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Confirm publishing and OIDC authority are absent
        run: >-
          bun -e "if (process.env.ID_TOKEN_REQUEST_URL || process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          throw new Error('OIDC authority must remain absent while Sigstore trust is unconfigured');"
      - name: Generate explicitly non-production retained contract input
        id: retained
        run: |
          started_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          bun run scripts/evals/agent-task-evidence-producer.ts \
            --mode=contract-input \
            --stage="${{ inputs.stage }}" \
            --repository="$AGENT_TASK_REPOSITORY" \
            --repository-id="$AGENT_TASK_REPOSITORY_ID" \
            --head-sha="$AGENT_TASK_HEAD_SHA" \
            --started-at="$started_at" \
            --output=agent-task-retained-input.json
          echo "started_at=$(jq -r .startedAt agent-task-retained-input.json)" >> "$GITHUB_OUTPUT"
          echo "ended_at=$(jq -r .endedAt agent-task-retained-input.json)" >> "$GITHUB_OUTPUT"
      - name: Upload retained input and obtain immutable artifact ID
        id: retained-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RETAINED_ARTIFACT_NAME }}
          path: agent-task-retained-input.json
          if-no-files-found: error
          retention-days: 14
      - name: Produce unsigned formal evidence
        run: |
          signed_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          bun run scripts/evals/agent-task-evidence-producer.ts \
            --mode=produce \
            --input=agent-task-retained-input.json \
            --output=agent-task-evidence.json \
            --product-output=agent-task-product-evidence.json \
            --repository="$AGENT_TASK_REPOSITORY" \
            --repository-id="$AGENT_TASK_REPOSITORY_ID" \
            --head-sha="$AGENT_TASK_HEAD_SHA" \
            --ref="$AGENT_TASK_REF" \
            --workflow-path="$AGENT_TASK_WORKFLOW_PATH" \
            --workflow-ref="$AGENT_TASK_WORKFLOW_REF" \
            --workflow-sha="$AGENT_TASK_WORKFLOW_SHA" \
            --run-id="$AGENT_TASK_RUN_ID" \
            --run-attempt="$AGENT_TASK_RUN_ATTEMPT" \
            --job="$AGENT_TASK_JOB" \
            --artifact-id="${{ steps.retained-upload.outputs.artifact-id }}" \
            --artifact-name="$RETAINED_ARTIFACT_NAME" \
            --signed-at="$signed_at"
      - name: Build independent expected product source
        env:
          RETAINED_ARTIFACT_ID: ${{ steps.retained-upload.outputs.artifact-id }}
        run: |
          bun -e 'const retained=await Bun.file("agent-task-retained-input.json").json(); await Bun.write("agent-task-expected-source.json", JSON.stringify({schema:"AgentTaskEvidenceSourceV1",repository:process.env.AGENT_TASK_REPOSITORY,repositoryId:process.env.AGENT_TASK_REPOSITORY_ID,headSha:process.env.AGENT_TASK_HEAD_SHA,ref:process.env.AGENT_TASK_REF,workflowPath:process.env.AGENT_TASK_WORKFLOW_PATH,workflowRef:process.env.AGENT_TASK_WORKFLOW_REF,workflowSha:process.env.AGENT_TASK_WORKFLOW_SHA,runId:process.env.AGENT_TASK_RUN_ID,runAttempt:Number(process.env.AGENT_TASK_RUN_ATTEMPT),job:process.env.AGENT_TASK_JOB,artifactId:process.env.RETAINED_ARTIFACT_ID,artifactName:process.env.RETAINED_ARTIFACT_NAME,startedAt:retained.startedAt,endedAt:retained.endedAt}))'
      - name: Independently verify expected identity and complete ledgers
        run: |
          bun run scripts/evals/verify-agent-task-evidence.ts \
            --evidence=agent-task-evidence.json \
            --output=agent-task-evidence-verification.json \
            --require-blocked=true \
            --expected-repository="$AGENT_TASK_REPOSITORY" \
            --expected-repository-id="$AGENT_TASK_REPOSITORY_ID" \
            --expected-head-sha="$AGENT_TASK_HEAD_SHA" \
            --expected-ref="$AGENT_TASK_REF" \
            --expected-workflow-path="$AGENT_TASK_WORKFLOW_PATH" \
            --expected-workflow-ref="$AGENT_TASK_WORKFLOW_REF" \
            --expected-workflow-sha="$AGENT_TASK_WORKFLOW_SHA" \
            --expected-run-id="$AGENT_TASK_RUN_ID" \
            --expected-run-attempt="$AGENT_TASK_RUN_ATTEMPT" \
            --expected-job="$AGENT_TASK_JOB" \
            --expected-artifact-id="${{ steps.retained-upload.outputs.artifact-id }}" \
            --expected-artifact-name="$RETAINED_ARTIFACT_NAME" \
            --expected-started-at="${{ steps.retained.outputs.started_at }}" \
            --expected-ended-at="${{ steps.retained.outputs.ended_at }}"
          jq -e \
            '.status == "blocked" and .evidenceEligible == false and
             .sourceIdentityVerified == true and
             .verification.signatureVerified == false and
             (.verification.reasonCodes | index("production_route_unconfigured")) != null and
             (.verification.reasonCodes | index("production_sigstore_verifier_unconfigured")) != null' \
            agent-task-evidence-verification.json
          bun run scripts/evals/verify-agent-task-product-evidence.ts \
            --formal-evidence=agent-task-evidence.json \
            --product-evidence=agent-task-product-evidence.json \
            --expected-source=agent-task-expected-source.json \
            --required-human-receipt-count=0 \
            --output=agent-task-product-evidence-verification.json \
            --require-blocked=true
          jq -e \
            '.status == "blocked" and .evidenceEligible == false and
             .productVerification.verifiedUxReceiptCount == .expectedAttemptCount and
             .productVerification.verifiedHumanReceiptCount == 0 and
             (.productVerification.reasonCodes | index("contract_conformance_not_production")) != null and
             (.productVerification.reasonCodes | index("production_product_evidence_authority_unconfigured")) != null' \
            agent-task-product-evidence-verification.json
      - name: Upload blocked evidence and independent verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-task-evidence-blocked-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            agent-task-evidence.json
            agent-task-evidence-verification.json
            agent-task-product-evidence.json
            agent-task-product-evidence-verification.json
          if-no-files-found: error
          retention-days: 14
