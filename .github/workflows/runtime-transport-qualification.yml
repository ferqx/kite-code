name: Runtime transport qualification

on:
  pull_request:
    paths:
      - "apps/kite-cli/src/bootstrap.ts"
      - "apps/kite-cli/src/bootstrap/runtime/**"
      - "apps/kite-cli/src/carrier/**"
      - "apps/kite-cli/src/cli/**"
      - "apps/kite-cli/test/isolated/runtime-stdio-*.test.ts"
      - "apps/kite-cli/test/isolated/runtime-server-composition.test.ts"
      - "apps/kite-cli/test/isolated/bun-stdio-child-transport.test.ts"
      - "apps/kite-cli/test/isolated/local-bootstrap-auth.test.ts"
      - "apps/kite-cli/test/isolated/development-loopback-carrier.test.ts"
      - "apps/kite-cli/test/isolated/bun-websocket-transport.test.ts"
      - "apps/kite-cli/test/isolated/development-websocket-runtime-client.test.ts"
      - "apps/kite-cli/test/isolated/development-runtime-reference.test.ts"
      - "apps/kite-cli/test/isolated/runtime-transport-conformance.test.ts"
      - "tests/tui-system/harness/fixtures/**"
      - "packages/runtime-client/**"
      - "packages/runtime-contract/**"
      - "packages/runtime-host/**"
      - "packages/runtime-protocol/**"
      - "packages/runtime-server/**"
      - "packages/runtime-storage-sqlite/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/runtime-transport-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:runtime:websocket
      - run: bun run test:runtime:transport
