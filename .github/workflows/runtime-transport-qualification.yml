name: Runtime transport qualification

on:
  pull_request:
    paths:
      - "apps/kite-cli/src/bootstrap.ts"
      - "apps/kite-cli/src/bootstrap/runtime/**"
      - "apps/kite-cli/src/carrier/**"
      - "apps/kite-cli/src/cli/**"
      - "apps/kite-cli/test/isolated/runtime-stdio-*.test.ts"
      - "apps/kite-cli/test/isolated/runtime-server-composition.test.ts"
      - "apps/kite-cli/test/isolated/bun-stdio-child-transport.test.ts"
      - "apps/kite-cli/test/isolated/local-bootstrap-auth.test.ts"
      - "apps/kite-cli/test/isolated/development-loopback-carrier.test.ts"
      - "apps/kite-cli/test/isolated/bun-websocket-transport.test.ts"
      - "apps/kite-cli/test/isolated/development-websocket-runtime-client.test.ts"
      - "apps/kite-cli/test/isolated/development-runtime-reference.test.ts"
      - "apps/kite-cli/test/isolated/runtime-transport-conformance.test.ts"
      - "tests/tui-system/harness/fixtures/**"
      - "packages/runtime-client/**"
      - "packages/runtime-contract/**"
      - "packages/runtime-host/**"
      - "packages/runtime-protocol/**"
      - "packages/runtime-server/**"
      - "packages/runtime-storage-sqlite/**"
      - "packages/kite-local-runtime/**"
      - "apps/kite-service/src/**"
      - "tests/qualification/session-store-*.test.ts"
      - "tests/qualification/fixtures/session-store-*.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/runtime-transport-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:runtime:websocket
      - run: bun run test:runtime:transport
      - if: runner.os != 'Windows'
        name: POSIX Store maintenance, crash release and startup cancellation
        run: >-
          bun test --parallel=1 --max-concurrency=1
          packages/runtime-storage-sqlite/test/isolated/kite-session-maintenance.test.ts
          tests/qualification/session-store-maintenance-cancellation.test.ts
          tests/qualification/session-store-startup-cancellation.test.ts
      - if: runner.os == 'Windows'
        name: Windows native LockFileEx maintenance qualification
        env:
          KITE_REQUIRE_WINDOWS_MAINTENANCE: "1"
        run: bun test --parallel=1 --max-concurrency=1 tests/qualification/session-store-windows-maintenance.test.ts
