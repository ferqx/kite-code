name: Runtime transport qualification

on:
  pull_request:
    paths:
      - "packages/ai/**"
      - "packages/agent/**"
      - "packages/client/**"
      - "packages/ui/**"
      - "apps/service/**"
      - "apps/cli/**"
      - "apps/desktop/**"
      - "apps/web/**"
      - "scripts/release/**"
      - "scripts/runtime/**"
      - "tests/isolated/unified-agent/**"
      - "tests/fixtures/unified-agent/**"
      - "tests/fixtures/formal-optional-capabilities/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/runtime-transport-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    timeout-minutes: 15
    env:
      KITE_EXPECTED_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      KITE_CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.KITE_EXPECTED_CANDIDATE_COMMIT }}
          repository: ${{ env.KITE_CANDIDATE_REPOSITORY }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - if: runner.os == 'Linux'
        name: Prepare Linux native verifier dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential bubblewrap
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Windows'
        name: Prepare installed Windows x64 Native compiler
        run: bun run scripts/release/prepare-windows-native-ci.ts
      - name: Build the current eight workspaces for shared caller tests
        run: bun run build
      - name: Complete MCP Tools caller through the current candidate
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-mcp-tools-pty.test.ts
      - name: Complete MCP Source caller in a fresh selected engine process
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-mcp-source-mutation-pty.test.ts
      - name: Complete MCP Source approval caller in a fresh selected engine process
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-mcp-source-approval-pty.test.ts
      - name: Complete MCP reconnection caller in a fresh selected engine process
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-mcp-reconnection-pty.test.ts
      - name: Complete MCP authentication caller through the current candidate
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-mcp-auth-pty.test.ts
      - name: Complete MCP configuration caller with original pending work
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-mcp-pty.test.ts
      - name: Complete cold MCP configuration caller with explicit original lookup
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-mcp-cold-pty.test.ts
      - name: Complete paired and shared Skills catalogue callers
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-skills-host.test.ts
      - name: Complete formal Terminal output and export in a fresh selected engine process
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-export-host.test.ts
      - name: Complete default question caller with original final answer
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-question-pty.test.ts
      - name: Complete original Work caller interruption and cold lookup
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-caller-intents-host.test.ts
      - name: Complete paired and shared formal CLI argv callers
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/cli-caller-host.test.ts
      - name: Complete ordinary CLI steer follow-up and cancel recovery
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/cli-caller-kinds.test.ts
      - name: Complete original TUI steer follow-up and cancel recovery
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/caller-kind-crash.test.ts
      - name: Complete actual development TUI Session Fork and Context maintenance
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-management-host.test.ts
      - name: Complete paired and shared model settings with original mutation lookup
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-models-host.test.ts
      - name: Complete original host status diagnostics and shared daemon loss
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-status-host.test.ts
      - name: Complete permissions caller through formal Shell and review
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-permissions-host.test.ts
      - name: Complete independent Job stop and original cold lookup through formal Shell
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-caller-job-stop.test.ts
      - name: Complete durable CLI library callers and local rejection contracts
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/cli-caller-library.test.ts
      - name: Complete Workspace file candidates and original draft completion
        run: bun test --parallel=1 --max-concurrency=1 apps/cli/test/isolated/tui-file-candidates-host.test.ts
      - run: bun run test:runtime:transport
      - if: runner.os != 'Windows'
        name: POSIX Profile locks, maintenance and recovery
        run: >-
          bun test --parallel=1 --max-concurrency=1
          packages/agent/test/isolated/profile-access/data-lock.test.ts
          packages/agent/test/isolated/maintenance/backup.test.ts
          packages/agent/test/isolated/maintenance/restore.test.ts
          apps/service/test/isolated/process-cleanup-retention.test.ts
      - if: runner.os == 'Windows'
        name: Actual Windows private Store, Worker and LockFileEx contracts
        run: >-
          bun test --parallel=1 --max-concurrency=1
          packages/agent/test/isolated/windows-path-security/default.test.ts
          packages/agent/test/isolated/config/mcp-selection-windows.test.ts
          apps/desktop/test/isolated/windows-node-access.test.ts
      - name: Shared TUI drafts and file recovery through the current caller
        run: >-
          bun test --parallel=1 --max-concurrency=1
          apps/cli/test/file-recovery-pty.test.ts
          apps/cli/test/isolated/tui-drafts-host.test.ts
          apps/cli/test/isolated/file-recovery-argv.test.ts
          apps/cli/test/isolated/tui-file-recovery.test.ts
          apps/cli/test/isolated/tui-file-recovery-lost-replies.test.ts
          apps/cli/test/isolated/tui-file-recovery-scopes.test.ts
          apps/cli/test/isolated/tui-file-recovery-crash.test.ts
          apps/cli/test/isolated/tui-recovery-host.test.ts
          apps/cli/test/isolated/tui-preferences-host.test.ts
          apps/cli/test/isolated/tui-mcp-connection-pty.test.ts
          apps/cli/test/isolated/tui-composer-host.test.ts
          apps/cli/test/isolated/tui-workflow-question-host.test.ts
          apps/cli/test/isolated/tui-planning-host.test.ts
          tests/isolated/unified-agent/extension-upgrade.test.ts
