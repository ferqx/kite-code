name: MCP native keyring smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - packages/builtin-runtime/src/mcp/credential-store.ts
      - tests/qualification/mcp-keyring-platform-smoke.test.ts
      - scripts/release/oss-candidate.ts
      - .github/workflows/mcp-native-keyring-smoke.yml
  pull_request:
    paths:
      - package.json
      - bun.lock
      - packages/builtin-runtime/src/mcp/credential-store.ts
      - tests/qualification/mcp-keyring-platform-smoke.test.ts
      - scripts/release/oss-candidate.ts
      - .github/workflows/mcp-native-keyring-smoke.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-keyring:
    name: ${{ matrix.os }} native keyring
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    env:
      KITE_RUN_NATIVE_KEYRING_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - if: runner.os != 'Linux'
        run: bun test tests/qualification/mcp-keyring-platform-smoke.test.ts
      - if: runner.os == 'Linux'
        name: Start Secret Service and run smoke
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_RUNTIME_DIR="${RUNNER_TEMP}/keyring-runtime"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            eval "$(printf %s ci-keyring | gnome-keyring-daemon --unlock --components=secrets)"
            bun test tests/qualification/mcp-keyring-platform-smoke.test.ts
          '
