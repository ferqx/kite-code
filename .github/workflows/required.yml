name: Required

on:
  pull_request:
  push:
    branches: [main, compact, man]

permissions:
  contents: read

jobs:
  protected-branch:
    name: protected-branch
    if: github.ref == 'refs/heads/man'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reject direct commits to man
        run: |
          parents=$(git rev-list --parents -n 1 "$GITHUB_SHA")
          count=$(printf '%s\n' "$parents" | wc -w | tr -d ' ')
          if [ "$count" -lt 3 ]; then
            echo "拒绝直接提交到 man；请通过 Pull Request 合并。"
            exit 1
          fi

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check:core-boundary
      - run: bun run check:compaction-legacy
      - run: bun run check:docs
        env:
          OPENPX_REQUIRE_EVIDENCE_HISTORY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      - run: bun run check:docs-impact

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test

  model-replay-required:
    name: model-replay-required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install Linux replay isolation boundary
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: /usr/bin/env -u BUN_OPTIONS -u NODE_OPTIONS bun --no-env-file run eval:replay:required

  compaction-contract:
    name: compaction-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:mock

  runtime-e2e:
    name: runtime-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  runtime-fault-soak:
    name: runtime-fault-soak
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:runtime:fault
      - run: bun run test:runtime:soak

  tui-system-shard:
    name: tui-system (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:tui:system
        env:
          KITE_TUI_SYSTEM_SHARD: ${{ matrix.shard }}/4

  # Keep the established required-check name while making every isolated PTY
  # shard visible and independently retryable in the Actions UI.
  tui-system:
    name: tui-system
    needs: tui-system-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all TUI PTY shards passed
        run: test "${{ needs.tui-system-shard.result }}" = "success"
