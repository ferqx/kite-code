name: Required

on:
  pull_request:
  push:
    branches: [main, compact, man, el-refactor]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protected-branch:
    name: protected-branch
    if: github.ref == 'refs/heads/man'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Reject direct commits to man
        run: |
          parents=$(git rev-list --parents -n 1 "$GITHUB_SHA")
          count=$(printf '%s\n' "$parents" | wc -w | tr -d ' ')
          if [ "$count" -lt 3 ]; then
            echo "拒绝直接提交到 man；请通过 Pull Request 合并。"
            exit 1
          fi

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare Bun cache path
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/kite-bun-install-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: quality-bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock', 'package.json', 'bunfig.toml', '.npmrc', 'packages/trajectory/package.json', 'packages/trace-extension-sdk/package.json', 'packages/ai/package.json', 'packages/agent/package.json', 'packages/client/package.json', 'packages/ui/package.json', 'apps/service/package.json', 'apps/cli/package.json', 'apps/desktop/package.json', 'apps/web/package.json', 'patches/**') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare quality Web assets
        working-directory: apps/web
        run: bun run build
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run check:runtime-packages
      - run: bun run check:unified-api
      - run: bun run check:test-ownership
      - run: bun run check:docs
        env:
          OPENPX_REQUIRE_EVIDENCE_HISTORY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      - run: bun run check:plan-evidence
      - run: bun run check:docs-impact --scope=range
        env:
          DOCS_IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  unit-shard:
    name: unit (${{ matrix.shard }}/8)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare browser path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/kite-playwright-browsers" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Prepare Linux native qualification dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential bubblewrap xvfb
      - name: Build MCP runtime assets
        run: bun packages/agent/src/mcp/build-assets.ts packages/agent/dist
      - name: Prepare browser for production CSS regressions
        run: bun apps/desktop/node_modules/playwright/cli.js install --with-deps chromium
      - run: xvfb-run -a bun run test
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/unit.log "{0}"
        env:
          KITE_UNIT_SHARD: ${{ matrix.shard }}/8
          KITE_TEST_SCOPE: required-agent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: unit-${{ matrix.shard }}
          path: dist/unified-evidence/unit.log
          if-no-files-found: error
          retention-days: 7

  unit:
    name: unit
    needs: unit-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every default test shard
        env:
          RESULT: ${{ needs.unit-shard.result }}
        run: test "$RESULT" = success

  compaction-contract:
    name: compaction-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:mock

  runtime-e2e:
    name: runtime-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  runtime-fault-soak:
    name: runtime-fault-soak
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Prepare Linux native probe dependencies
        id: native-deps
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential bubblewrap
      - run: bun run test:runtime:fault
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/runtime-fault.log "{0}"
      - name: Collect the independent bounded diagnostic
        if: "!cancelled() && steps.native-deps.outcome == 'success'"
        run: bun run scripts/runtime/unified-soak.ts --profile=ci --output=dist/unified-evidence/unified-soak-ci.json
      - name: Preserve bounded diagnostic soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unified-soak-ci
          path: dist/unified-evidence/unified-soak-ci.json
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: runtime-fault
          path: dist/unified-evidence/runtime-fault.log
          if-no-files-found: error
          retention-days: 7

  desktop-client:
    name: Desktop client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - if: runner.os == 'Windows'
        name: Prepare Windows x64 native compiler
        run: bun run scripts/release/prepare-windows-native-ci.ts
      - run: bun install --frozen-lockfile
      - name: Install the locked Electron binary for this host
        run: node apps/desktop/node_modules/electron/install.js
      - run: bun run build
      - name: Exercise the sandboxed browser and its native window ownership
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/desktop-browser.log "{0}"
        run: bun test --parallel=1 --max-concurrency=1 apps/desktop/test/isolated/native-browser.test.ts
      - name: Restore model preferences across Electron restarts
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/desktop-preferences.log "{0}"
        run: bun test --parallel=1 --max-concurrency=1 apps/desktop/test/isolated/native-model-preference-electron.test.ts
      - name: Render images with the original and relocated private codec
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/desktop-images.log "{0}"
        run: bun test --parallel=1 --max-concurrency=1 apps/desktop/test/isolated/native-image-display-bundle.test.ts
      - name: Exercise file edit and write states in a real Electron window
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/desktop-window.log "{0}"
        run: bun apps/desktop/test/file-ui-electron-runner.fixture.ts
      - name: Fail if the Electron report or its final screenshot is missing
        if: >-
          success() && (hashFiles('.cache/file-ui-electron-*/report.json') == '' ||
          hashFiles('.cache/file-ui-electron-*/narrow-edit.png') == '')
        run: exit 1
      - if: runner.os == 'Windows'
        name: Check native Office file history and permissions in Electron
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/desktop-host.log "{0}"
        run: bun test --parallel=1 --max-concurrency=1 apps/desktop/test/isolated/windows-office-editor.test.ts
      - if: runner.os == 'macOS'
        name: Check Electron preload, service refresh and shutdown
        shell: bun run scripts/ci/logged-shell.ts --log=dist/unified-evidence/desktop-host.log "{0}"
        run: bun test --parallel=1 --max-concurrency=1 apps/desktop/test/isolated/native-electron.test.ts
      - name: Preserve desktop logs, screenshots and assertions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-client-${{ matrix.os }}
          path: |
            dist/unified-evidence/desktop-*.log
            .cache/file-ui-electron-*/report.json
            .cache/file-ui-electron-*/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
