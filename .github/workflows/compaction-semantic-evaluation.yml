name: Compaction Semantic Evaluation Candidate

on:
  workflow_dispatch:
    inputs:
      producer_input_path:
        description: Checked-in blinded producer input path
        required: true
        type: string

permissions:
  contents: read

jobs:
  semantic-evaluation:
    runs-on: ubuntu-24.04
    env:
      SEMANTIC_WORKFLOW_PATH: .github/workflows/compaction-semantic-evaluation.yml
      SEMANTIC_JOB_NAME: semantic-evaluation
      SEMANTIC_REPOSITORY_NODE_ID: R_kgDOSKbi8g
      SEMANTIC_PRODUCER_INPUT_PATH: ${{ inputs.producer_input_path }}
      SEMANTIC_RETAINED_ARTIFACT_NAME: compaction-semantic-contract-input-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Snapshot the exact tracked input blob from GITHUB_SHA
        run: >-
          bun run scripts/evals/snapshot-tracked-semantic-input.ts
          --workspace "$GITHUB_WORKSPACE"
          --commit "$GITHUB_SHA"
          --input "$SEMANTIC_PRODUCER_INPUT_PATH"
          --snapshot "$RUNNER_TEMP/compaction-semantic-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          --github-env "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Capture qualification start
        run: echo "SEMANTIC_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
      - name: Validate semantic evidence contracts
        run: bun test tests/evals/compaction/semantic-evidence.test.ts
      - name: Validate the immutable tracked-blob snapshot
        run: >-
          bun -e "import { lstatSync, readFileSync, statSync } from 'node:fs';
          import { semanticEvaluationProducerInputV1Schema } from './tests/evals/compaction/semantic-evidence';
          const snapshot = process.env.SEMANTIC_SNAPSHOT_PATH ?? '';
          if (lstatSync(snapshot).isSymbolicLink()) throw new Error('tracked snapshot cannot be a symlink');
          const status = statSync(snapshot);
          if (!status.isFile() || status.size < 1 || status.size > 1048576) throw new Error('producer input must be a bounded regular file');
          semanticEvaluationProducerInputV1Schema.parse(JSON.parse(readFileSync(snapshot, 'utf8')));"
      - name: Retain the unsigned contract input and obtain its GitHub artifact ID
        id: retained-input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.SEMANTIC_RETAINED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/compaction-semantic-input-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Produce blocked evidence candidate
        env:
          SEMANTIC_RETAINED_ARTIFACT_ID: ${{ steps.retained-input.outputs.artifact-id }}
        run: >-
          bun run scripts/evals/produce-compaction-semantic-evidence.ts
          --input "$SEMANTIC_SNAPSHOT_PATH"
          --output compaction-semantic-evidence.json
      - name: Independently verify expected identity and ledger
        env:
          SEMANTIC_RETAINED_ARTIFACT_ID: ${{ steps.retained-input.outputs.artifact-id }}
        run: >-
          bun run scripts/evals/verify-compaction-semantic-evidence.ts
          --evidence compaction-semantic-evidence.json
          --expectation-input "$SEMANTIC_SNAPSHOT_PATH"
          --output compaction-semantic-verification.json
      - name: Enforce fail-closed candidate status
        run: |
          jq -e \
            '.source.source == "github_actions_unsigned_contract" and
             .source.signature.kind == "unconfigured" and
             .source.signature.algorithm == "none"' \
            compaction-semantic-evidence.json
          jq -e \
            '.status == "blocked" and .evidenceEligible == false and
             .authenticatedEvaluatorRoute == false and .sigstoreTrustConfigured == false' \
            compaction-semantic-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compaction-semantic-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            compaction-semantic-evidence.json
            compaction-semantic-verification.json
          if-no-files-found: error
          retention-days: 14
