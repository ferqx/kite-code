name: Capability Evaluation Contract

on:
  workflow_dispatch:
    inputs:
      capability:
        description: Capability contract to rebuild
        required: true
        default: verification
        type: choice
        options:
          - verification
          - mcp_write
          - skills_readonly
          - skills_effectful
      acknowledge_blocked_contract_only:
        description: Produce unsigned, non-production, evidence-ineligible contract artifacts only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  capability-evaluation-contract:
    if: >-
      github.repository == 'ferqx/kite-code' &&
      inputs.acknowledge_blocked_contract_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAPABILITY_REPOSITORY: ferqx/kite-code
      CAPABILITY_REPOSITORY_ID: R_kgDOSKbi8g
      CAPABILITY_WORKFLOW_PATH: .github/workflows/capability-evaluation.yml
      CAPABILITY_JOB: capability-evaluation-contract
      RETAINED_ARTIFACT_NAME: capability-retained-${{ inputs.capability }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Confirm publishing and OIDC authority are absent
        run: >-
          bun -e "if (process.env.ID_TOKEN_REQUEST_URL || process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          throw new Error('OIDC authority must remain absent while the production registry is empty');"
      - name: Generate explicitly non-production retained input
        run: |
          started_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          bun run scripts/evals/capability-evidence-producer.ts \
            --mode=contract-input \
            --capability="${{ inputs.capability }}" \
            --repository="$CAPABILITY_REPOSITORY" \
            --repository-id="$CAPABILITY_REPOSITORY_ID" \
            --head-sha="${{ github.sha }}" \
            --started-at="$started_at" \
            --output=capability-retained-input.json
      - name: Upload retained input and obtain immutable artifact ID
        id: retained-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RETAINED_ARTIFACT_NAME }}
          path: capability-retained-input.json
          if-no-files-found: error
          retention-days: 14
      - name: Produce unsigned capability evidence
        run: |
          bun run scripts/evals/capability-evidence-producer.ts \
            --mode=produce \
            --input=capability-retained-input.json \
            --output=capability-evidence.json \
            --repository="$CAPABILITY_REPOSITORY" \
            --repository-id="$CAPABILITY_REPOSITORY_ID" \
            --head-sha="${{ github.sha }}" \
            --ref="${{ github.ref }}" \
            --workflow-path="$CAPABILITY_WORKFLOW_PATH" \
            --workflow-ref="${{ github.workflow_ref }}" \
            --workflow-sha="${{ github.workflow_sha }}" \
            --run-id="${{ github.run_id }}" \
            --run-attempt="${{ github.run_attempt }}" \
            --job="$CAPABILITY_JOB" \
            --artifact-id="${{ steps.retained-upload.outputs.artifact-id }}" \
            --artifact-name="$RETAINED_ARTIFACT_NAME"
      - name: Build independent expected source from workflow facts
        env:
          RETAINED_ARTIFACT_ID: ${{ steps.retained-upload.outputs.artifact-id }}
        run: |
          bun -e 'const retained=await Bun.file("capability-retained-input.json").json(); await Bun.write("capability-expected-source.json", JSON.stringify({schema:"CapabilityEvaluationSourceV1",canonicalRepository:process.env.CAPABILITY_REPOSITORY,repositoryId:process.env.CAPABILITY_REPOSITORY_ID,headSha:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF,workflowPath:process.env.CAPABILITY_WORKFLOW_PATH,workflowRef:process.env.GITHUB_WORKFLOW_REF,workflowSha:process.env.GITHUB_WORKFLOW_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),job:process.env.CAPABILITY_JOB,retainedArtifactId:process.env.RETAINED_ARTIFACT_ID,retainedArtifactName:process.env.RETAINED_ARTIFACT_NAME,startedAt:retained.startedAt,endedAt:retained.endedAt}))'
      - name: Independently verify retained input and expected source
        run: |
          now=$(jq -r .observedAt capability-evidence.json)
          bun run scripts/evals/verify-capability-evidence.ts \
            --evidence=capability-evidence.json \
            --retained-input=capability-retained-input.json \
            --expected-source=capability-expected-source.json \
            --now="$now" \
            --output=capability-evidence-verification.json \
            --require-blocked=true
          jq -e '.status == "blocked" and .evidenceEligible == false and .sourceIdentityVerified == true and .retainedInputVerified == true and (.verification.reasonCodes | index("production_oidc_sigstore_authority_unconfigured")) != null' capability-evidence-verification.json
      - name: Upload blocked evidence and verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capability-evidence-blocked-${{ inputs.capability }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            capability-evidence.json
            capability-evidence-verification.json
          if-no-files-found: error
          retention-days: 14
