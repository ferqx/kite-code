name: OSS Release Candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate-${{ matrix.target }}
    env:
      KITE_EXPECTED_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      KITE_CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.KITE_EXPECTED_CANDIDATE_COMMIT }}
          repository: ${{ env.KITE_CANDIDATE_REPOSITORY }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Windows'
        name: Select reproducible Windows GNU Rust toolchain
        run: |
          rustup toolchain install 1.97.1-x86_64-pc-windows-gnu --profile minimal
          rustup override set 1.97.1-x86_64-pc-windows-gnu
      - if: runner.os == 'Windows'
        name: Build pinned Windows sandbox runner
        run: bun run scripts/release/build-windows-runner.ts
      - if: runner.os == 'Windows'
        name: Verify Windows runner manifest pin
        run: |
          bun run scripts/release/windows-runner-evidence.ts
          git diff --exit-code -- release/platform-capabilities/windows-runner.json
      - if: runner.os == 'Windows'
        name: Verify Windows App Server endpoint and Session Store fencing
        run: >-
          bun test
          packages/kite-local-runtime/test/isolated/lifecycle-reservation.test.ts
          packages/runtime-storage-sqlite/test/kite-session-runtime-file.test.ts
          packages/runtime-storage-sqlite/test/kite-session-execution-authority.test.ts
          packages/runtime-storage-sqlite/test/kite-session-mutation.test.ts
          tests/release/app-server-daemon.test.ts
      - name: Release contract tests
        run: >-
          bun test
          tests/release/oss-candidate.test.ts
          tests/release/oss-install.test.ts
          tests/release/supply-chain-workflow.test.ts
      - name: Build native candidate
        run: bun run release:build
      - name: Verify manifest and checksums
        run: bun run release:verify -- --require-clean-source
      - name: Install, start, rollback, and uninstall smoke
        run: bun run release:smoke
      - name: TUI PTY startup smoke
        run: bun run scripts/run-tui-system-tests.ts startup
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kite-code-${{ matrix.target }}
          path: |
            dist/oss-candidate/kite-code-${{ matrix.target }}.tar.gz
            dist/oss-candidate/kite-code-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
