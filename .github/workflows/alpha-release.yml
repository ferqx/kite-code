name: Publish Alpha Release

on:
  push:
    tags:
      - v0.1.0-alpha-1

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify release version
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "0.1.0-alpha-1"
          test "$GITHUB_REF_NAME" = "v0.1.0-alpha-1"
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Windows'
        name: Build pinned Windows sandbox runner
        shell: bash
        run: |
          rustup toolchain install 1.97.1-x86_64-pc-windows-gnu --profile minimal
          rustup override set 1.97.1-x86_64-pc-windows-gnu
          bun run scripts/release/build-windows-runner.ts
          bun run scripts/release/windows-runner-evidence.ts
          git diff --exit-code -- release/platform-capabilities/windows-runner-v1.json
      - run: bun test tests/release/oss-candidate.test.ts tests/release/oss-install.test.ts
      - run: bun run release:build
      - run: bun run release:verify -- --require-clean-source
      - run: bun run release:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kite-code-${{ matrix.target }}
          path: |
            dist/oss-candidate/kite-code-${{ matrix.target }}.tar.gz
            dist/oss-candidate/kite-code-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish-github-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kite-code-*
          path: dist/oss-candidate
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/oss-candidate/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Kite Code 0.1.0-alpha-1" \
              --notes "Alpha release based on 0.1.0. This is a prerelease." \
              --prerelease \
              dist/oss-candidate/*
          fi
      - name: Publish npm package
        run: |
          npx --yes npm@11.5.1 publish --registry https://registry.npmjs.org/ --tag alpha --access public
