name: Agent Live Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

# This serializes manual diagnostic dispatch only. It is not a cross-run quota
# ledger or a retained-evidence reservation.
concurrency:
  group: agent-live-evaluation-main-v1
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'ferqx/openpx-new' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify no-secret diagnostic contracts
        run: >-
          bun test
          tests/evals/qualification/github-actions-agent-evaluation.test.ts
          tests/evals/qualification/github-actions-agent-evaluation-workflow.test.ts
          tests/evals/qualification/github-actions-agent-diagnostic-model-lease.test.ts
          tests/evals/qualification/github-actions-auto-compaction.test.ts
          tests/evals/qualification/github-actions-agent-diagnostic-aggregate.test.ts
      - name: Write no-secret diagnostic preflight report
        run: bun run eval:agent:live:preflight

  live-agent-evaluation:
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'ferqx/openpx-new' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    environment:
      name: agent-live-eval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run fixed real-Agent diagnostic suite
        env:
          KITE_AGENT_LIVE_EVAL_QWEN_API_KEY: ${{ secrets.KITE_AGENT_LIVE_EVAL_QWEN_API_KEY }}
        run: bun run eval:agent:live
