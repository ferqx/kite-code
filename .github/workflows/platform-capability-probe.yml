name: Platform Capability Probe

on:
  pull_request:
    paths:
      - "packages/ai/**"
      - "packages/agent/**"
      - "packages/client/**"
      - "packages/ui/**"
      - "apps/service/**"
      - "apps/cli/**"
      - "apps/desktop/**"
      - "apps/web/**"
      - "scripts/release/**"
      - "scripts/runtime/**"
      - "tests/isolated/unified-agent/**"
      - "tests/fixtures/unified-agent/**"
      - "tests/fixtures/formal-optional-capabilities/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/platform-capability-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-probe:
    timeout-minutes: 30
    env:
      QUALIFICATION_REPOSITORY: ${{ github.repository }}
      QUALIFICATION_REPOSITORY_ID: ${{ github.repository_id }}
      QUALIFICATION_HEAD_SHA: ${{ github.sha }}
      QUALIFICATION_REF: ${{ github.ref }}
      QUALIFICATION_WORKFLOW: .github/workflows/platform-capability-probe.yml
      QUALIFICATION_WORKFLOW_REF: ${{ github.workflow_ref }}
      QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QUALIFICATION_RUN_ID: ${{ github.run_id }}
      QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
      QUALIFICATION_RUNNER_CLASS: ${{ matrix.runner_class }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            runner_class: macos-15-arm64-github-hosted
          - os: ubuntu-24.04
            runner_class: ubuntu-24.04-x64-github-hosted
          - os: windows-2025
            runner_class: windows-2025-x64-github-hosted
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Current public boundary and fail-closed contracts
        run: >-
          bun test --parallel=1 --max-concurrency=1
          packages/agent/test/isolated/jobs/confined-shell.test.ts
          packages/agent/test/isolated/files/files.test.ts
          packages/agent/test/isolated/execution/owner-handoff.test.ts
          apps/service/test/isolated/shell-configuration.test.ts
          tests/isolated/unified-agent/unified-platform.test.ts
      - run: bun -e "require('node:fs').mkdirSync('dist/unified-evidence',{recursive:true})"
      - run: bun run release:build --directory dist/unified-terminal
      - name: Actual relocated candidate Files, assets, default capability and lifetime probe
        run: >-
          bun run scripts/release/unified-platform-probe.ts
          "--candidate=${{ github.workspace }}/dist/unified-terminal"
          "--output=${{ github.workspace }}/dist/unified-evidence/platform.json"
      - name: Check diagnostic evidence
        run: >-
          bun run scripts/release/unified-platform-verify.ts
          "--report=${{ github.workspace }}/dist/unified-evidence/platform.json"
          --mode=diagnostic
      - name: Require complete native execution qualification
        if: always()
        run: >-
          bun run scripts/release/unified-platform-verify.ts
          "--report=${{ github.workspace }}/dist/unified-evidence/platform.json"
          --mode=formal
      - name: Preserve actual evidence and unsigned candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-capability-${{ matrix.os }}
          path: dist/unified-evidence/platform.json
          if-no-files-found: error
          overwrite: false
