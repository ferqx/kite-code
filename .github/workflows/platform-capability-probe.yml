name: Platform Capability Probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/core/sandbox/**"
      - "src/core/tools/process-tree.ts"
      - "scripts/release/platform-capability-probe.ts"
      - "release/platform-capabilities/**"
      - "tests/sandbox.test.ts"
      - "tests/sandbox-executor.test.ts"
      - "tests/sandbox-bwrap-executor.test.ts"
      - "tests/sandbox/platform-backends.test.ts"
      - "tests/sandbox/process-tree-limit.test.ts"
      - "tests/sandbox/platform-capability-probe.test.ts"
      - "tests/sandbox/execution-boundary.test.ts"
      - ".github/workflows/platform-capability-probe.yml"

permissions:
  contents: read

jobs:
  native-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap curl
      - name: Cross-platform exclusion contracts
        run: >-
          bun test
          tests/sandbox/platform-backends.test.ts
          tests/sandbox/process-tree-limit.test.ts
          tests/sandbox/platform-capability-probe.test.ts
          tests/sandbox/execution-boundary.test.ts
      - if: runner.os == 'macOS'
        name: macOS native Seatbelt executor
        run: bun test tests/sandbox.test.ts tests/sandbox-executor.test.ts
      - if: runner.os == 'Linux'
        name: Linux native bubblewrap candidate
        run: bun test tests/sandbox.test.ts tests/sandbox-bwrap-executor.test.ts
      - run: bun run scripts/release/platform-capability-probe.ts platform-capability-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: platform-capability-${{ matrix.os }}
          path: platform-capability-evidence.json
          if-no-files-found: error
