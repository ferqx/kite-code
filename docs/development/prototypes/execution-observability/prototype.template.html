<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>执行与审批 · 交互地图</title>
    <style>
    :root {
      --bg: #f4f6f8;
      --surface: #fff;
      --ink: #1d2939;
      --muted: #667387;
      --line: #e3e8ee;
      --primary: #087f76;
      --soft: #e8f5f2;
      --warn: #a45b10;
      --warn-bg: #fff4e5;
      --bad: #bb3c4a;
      --bad-bg: #fceef0;
      --blue: #3767b1;
      --blue-bg: #eef3fc;
      --purple: #7555a6;
      --radius: 12px;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: var(--bg);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    button,
    input,
    select {
      font: inherit;
    }
    button,
    a,
    input,
    select {
      outline-offset: 3px;
    }
    button {
      cursor: pointer;
    }
    button:disabled {
      cursor: default;
      opacity: 0.42;
    }
    a {
      color: var(--primary);
      text-underline-offset: 3px;
    }
    button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 7px;
      padding: 8px 12px;
      line-height: 1.3;
    }
    button:hover:not(:disabled) {
      border-color: #a7b8c5;
      background: #f8fafb;
    }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    button.primary:hover {
      background: #096b64;
    }
    button.ghost {
      background: transparent;
      border-color: transparent;
    }
    button.small {
      font-size: 12px;
      padding: 5px 8px;
    }
    input,
    select {
      border: 1px solid #d5dde6;
      border-radius: 7px;
      background: #fff;
      padding: 8px 10px;
      color: var(--ink);
      min-width: 0;
    }
    input[type="search"] {
      width: 100%;
    }
    h1,
    h2,
    h3,
    p {
      margin: 0;
    }
    h1 {
      font-size: 24px;
      letter-spacing: -0.6px;
      font-weight: 650;
    }
    h2 {
      font-size: 17px;
      font-weight: 600;
    }
    h3 {
      font-size: 14px;
      font-weight: 600;
    }
    p {
      line-height: 1.7;
    }
    small,
    .small {
      font-size: 12px;
      line-height: 1.6;
    }
    .muted {
      color: var(--muted);
    }
    .mono,
    code,
    pre {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }
    code {
      font-size: 12px;
      background: #f0f3f6;
      padding: 2px 4px;
      border-radius: 4px;
      overflow-wrap: anywhere;
    }
    pre {
      margin: 0;
      font-size: 12px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      background: #f7f9fb;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      max-height: 420px;
      overflow: auto;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }
    .between {
      justify-content: space-between;
    }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 550;
      line-height: 1.45;
      background: #eef1f5;
      color: #536176;
      white-space: nowrap;
    }
    .tag.real {
      color: var(--primary);
      background: var(--soft);
    }
    .tag.demo,
    .tag.warn {
      background: var(--warn-bg);
      color: var(--warn);
    }
    .tag.bad {
      background: var(--bad-bg);
      color: var(--bad);
    }
    .tag.blue {
      color: var(--blue);
      background: var(--blue-bg);
    }
    .dot {
      width: 6px;
      height: 6px;
      display: inline-block;
      background: currentColor;
      border-radius: 50%;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .card-pad {
      padding: 18px;
    }
    .callout {
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #e9d7bd;
      background: #fffaf2;
      font-size: 12px;
      line-height: 1.7;
      color: #795327;
    }
    .callout.info {
      background: #f0f7fb;
      border-color: #d6e6f2;
      color: #3f6382;
    }
    .callout.neutral {
      background: #f8fafb;
      border-color: var(--line);
      color: var(--muted);
    }
    .pillbar {
      display: inline-flex;
      gap: 3px;
      background: #edf1f4;
      padding: 3px;
      border-radius: 8px;
      flex-wrap: wrap;
    }
    .pillbar button {
      border: 0;
      background: transparent;
      padding: 7px 12px;
      font-size: 12px;
    }
    .pillbar button.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 4px #23394b14;
      font-weight: 600;
    }
    .topbar {
      min-height: 65px;
      padding: 12px 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .brandmark {
      width: 28px;
      height: 28px;
      background: var(--primary);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
    }
    .brand strong {
      font-size: 13px;
      letter-spacing: 1.7px;
    }
    .brand .divider {
      height: 18px;
      border-left: 1px solid var(--line);
      margin: 0 5px;
    }
    .layout {
      display: grid;
      grid-template-columns: 214px minmax(0, 1fr);
      min-height: calc(100vh - 65px);
    }
    .sidebar {
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .nav-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #8793a4;
      padding: 0 12px;
      margin-bottom: 9px;
    }
    .nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .nav button {
      border: 0;
      background: transparent;
      text-align: left;
      display: flex;
      gap: 11px;
      align-items: center;
      padding: 11px 12px;
      color: #536176;
    }
    .nav button.active {
      background: var(--soft);
      color: var(--primary);
      font-weight: 600;
    }
    .nav button .num {
      font-size: 11px;
      color: #8d9bad;
      margin-left: auto;
    }
    .nav-symbol {
      font-size: 17px;
      width: 20px;
      text-align: center;
    }
    .side-note {
      margin-top: auto;
      padding: 14px 11px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      line-height: 1.8;
      color: var(--muted);
    }
    .main {
      padding: 26px 28px 32px;
      min-width: 0;
    }
    .heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }
    .heading p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 7px;
      max-width: 760px;
    }
    .eyebrow {
      color: var(--primary);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 1.5px;
      margin-bottom: 9px;
    }
    .factrow {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .fact {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 13px 15px;
      border-radius: 9px;
    }
    .fact .n {
      color: #93a2b2;
      font-size: 12px;
    }
    .fact strong {
      font-size: 13px;
      font-weight: 550;
    }
    .fact small {
      color: var(--muted);
      display: block;
      font-size: 11px;
      margin-top: 3px;
    }
    .controls {
      padding: 14px 16px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 130px;
    }
    .field label {
      font-size: 11px;
      color: var(--muted);
    }
    .field.grow {
      flex: 1;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 338px;
      gap: 16px;
      align-items: start;
    }
    .graph-panel {
      min-width: 0;
      overflow: hidden;
    }
    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .panel-header p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    .graph-scroll {
      height: 590px;
      overflow: auto;
      position: relative;
      background-color: #fbfcfd;
      background-image: radial-gradient(#d9e1e8 0.7px, transparent 0.7px);
      background-size: 16px 16px;
      scroll-behavior: smooth;
    }
    .graph {
      position: relative;
      min-width: 720px;
      padding: 0 14px 24px;
    }
    .lanes {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      position: sticky;
      top: 0;
      z-index: 4;
      background: #f6f8faef;
      border-bottom: 1px solid var(--line);
      margin: 0 -14px 10px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
    }
    .lane-label {
      text-align: center;
      font-size: 11px;
      color: #6a7c8f;
    }
    .graph-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-auto-rows: minmax(68px, auto);
      gap: 14px 9px;
      z-index: 2;
    }
    .node {
      width: 100%;
      position: relative;
      text-align: left;
      min-height: 65px;
      padding: 9px 10px;
      border: 1px solid #dce4eb;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 4px #29415c06;
      font-size: 12px;
      transition:
        opacity 0.15s,
        border-color 0.15s,
        box-shadow 0.15s;
    }
    .node strong {
      display: block;
      font-size: 12px;
      font-weight: 550;
      line-height: 1.6;
    }
    .node .sub {
      font-size: 10px;
      color: #8190a0;
      display: block;
      line-height: 1.5;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }
    .node .step {
      position: absolute;
      top: -7px;
      left: 8px;
      font-size: 9px;
      border-radius: 3px;
      background: #e9eef3;
      color: #7b899b;
      padding: 1px 4px;
    }
    .node.past {
      border-color: #a9c8bf;
      background: #f5fbf9;
    }
    .node.future {
      opacity: 0.56;
    }
    .node.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px #087f7618;
      opacity: 1;
      background: #fff;
    }
    .node.bad-node {
      background: #fff3f4;
      border-color: #edbec3;
    }
    .node.warn-node {
      background: #fff8ee;
      border-color: #edd6b5;
    }
    .node.sink {
      border-color: #c9bee4;
      background: #f8f5fc;
    }
    .connectors {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }
    .connectors path.edge {
      fill: none;
      stroke: #c8d4de;
      stroke-width: 1.4;
    }
    .connectors path.edge.past {
      stroke: #78a99c;
    }
    .connectors text {
      font-size: 9px;
      fill: #738397;
      paint-order: stroke;
      stroke: #fbfcfd;
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .playbar {
      padding: 12px 16px;
      display: flex;
      gap: 9px;
      align-items: center;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .playbar .progress {
      flex: 1;
      height: 4px;
      background: #e9eef1;
      border-radius: 3px;
      overflow: hidden;
    }
    .playbar .progress div {
      height: 100%;
      background: var(--primary);
      transition: width 0.2s;
    }
    .step-count {
      font-size: 11px;
      color: var(--muted);
      min-width: 46px;
    }
    .detail {
      position: sticky;
      top: 16px;
      overflow: hidden;
    }
    .detail-top {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }
    .detail-top h2 {
      margin: 10px 0 6px;
      font-size: 16px;
      line-height: 1.5;
    }
    .detail-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 670px;
      overflow: auto;
    }
    .kv {
      display: grid;
      grid-template-columns: 94px minmax(0, 1fr);
      gap: 8px 10px;
      font-size: 12px;
      line-height: 1.7;
    }
    .kv dt {
      color: #8090a1;
      overflow-wrap: anywhere;
    }
    .kv dd {
      margin: 0;
      overflow-wrap: anywhere;
    }
    .detail-section h3 {
      margin-bottom: 8px;
      color: #47596c;
      font-size: 12px;
    }
    .detail-section p {
      font-size: 12px;
      line-height: 1.8;
    }
    .detail-actions {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
    }
    .source-link {
      display: block;
      font-size: 11px;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .summary-card {
      padding: 18px;
    }
    .summary-card h3 {
      margin-bottom: 10px;
    }
    .summary-card p {
      font-size: 12px;
      color: var(--muted);
    }
    .summary-card .value {
      font-size: 25px;
      font-weight: 600;
      margin: 8px 0;
    }
    .catalog {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .tool-card {
      padding: 18px;
    }
    .tool-card .names {
      margin: 10px 0;
      font-size: 11px;
      line-height: 2;
    }
    .tool-card p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.9;
    }
    .tool-card footer {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 9px;
    }
    .table-wrap {
      overflow: auto;
    }
    .matrix {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .matrix th,
    .matrix td {
      padding: 12px 14px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
      line-height: 1.8;
    }
    .matrix th {
      background: #f7f9fa;
      font-weight: 550;
      color: #66778b;
    }
    .matrix td:first-child {
      min-width: 150px;
      font-weight: 500;
    }
    .log-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 386px;
      gap: 16px;
      align-items: start;
    }
    .log-filters {
      display: grid;
      grid-template-columns: 1.1fr 1fr 1fr;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .log-filters .search {
      grid-column: 1 / -1;
    }
    .log-table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
      font-size: 11px;
    }
    .log-table th {
      text-align: left;
      font-weight: 500;
      color: #8290a0;
      background: #f7f9fb;
      padding: 10px 12px;
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
    }
    .log-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #eef1f4;
      color: #5f6f81;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .log-table tr {
      cursor: pointer;
    }
    .log-table tbody tr:hover {
      background: #f4f9f8;
    }
    .log-table tbody tr.chosen {
      background: #e9f5f2;
    }
    .log-table .event-title {
      font-size: 12px;
      color: var(--ink);
      display: block;
    }
    .log-table .event-id {
      font-size: 10px;
      color: #8a98a8;
      display: block;
      margin-top: 4px;
    }
    .log-table .session-pill {
      padding: 2px 6px;
      background: #eef2f6;
      border-radius: 4px;
    }
    .log-list {
      max-height: 560px;
      overflow: auto;
    }
    .log-pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
    }
    .log-detail {
      position: sticky;
      top: 16px;
      overflow: hidden;
      min-width: 0;
    }
    .tabs {
      display: flex;
      gap: 3px;
      padding: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }
    .tabs button {
      border: 0;
      font-size: 11px;
      padding: 7px 9px;
      white-space: nowrap;
      background: transparent;
    }
    .tabs button.active {
      color: var(--primary);
      background: var(--soft);
      font-weight: 600;
    }
    .log-detail .content {
      padding: 16px;
      max-height: min(690px, calc(100vh - 220px));
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .log-detail .content > * {
      flex-shrink: 0;
    }
    .log-summary {
      padding: 15px 16px;
      background: #f9fbfc;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.7;
    }
    .log-summary strong {
      font-size: 13px;
    }
    .empty {
      padding: 40px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }
    .source-cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .list {
      padding-left: 18px;
      margin: 8px 0 0;
      font-size: 12px;
      line-height: 2;
      color: #5d6d80;
    }
    .identity-tree {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
      margin-top: 9px;
    }
    .identity-tree span {
      background: #f0f3f6;
      padding: 4px 7px;
      border-radius: 5px;
    }
    .hidden {
      display: none !important;
    }
    .mobile-nav {
      display: none;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #213d47;
      color: #fff;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 12px;
      z-index: 100;
      box-shadow: 0 5px 30px #0002;
      max-width: 90vw;
    }
    .toast[hidden] {
      display: none;
    }
    .footer-note {
      font-size: 11px;
      color: #8592a2;
      margin-top: 16px;
      line-height: 1.8;
    }
    .status-succeeded,
    .status-completed {
      color: var(--primary);
    }
    .status-failed,
    .status-rejected {
      color: var(--bad);
    }
    .status-outcome_unknown {
      color: var(--purple);
    }
    .status-cancelled {
      color: var(--warn);
    }
    .review-reason {
      border-left: 3px solid #9dbab2;
      padding: 8px 11px;
      background: #f4f9f7;
      font-size: 12px;
      line-height: 1.85;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .stats-inline {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
    }
    .stats-inline strong {
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
    }
    .jump-list {

            '看见的是什么，没记录的就不补造',
            '这份原型把现有记录关联起来，日志操作只读。来源层级和完整性边界保持分开。',
          ) +
          `<div class="source-cards">${[
            [
              '事件日志',
              '真实 append-time 元数据',
              'cursor、occurredAt（或不可用）、对象 ID、recordedStatus、闭合 summary、有限导航。每个 Session 单独读取，固定 upperCursor 分页。',
              'packages/agent/src/storage/sqlite/session-logs.README.md',
            ],
            [
              '原执行与决定',
              '当前原记录 / 不是旧事件状态',
              '精确 kind / 定义 / 版本 / attempt、原结果与公开授权观察。只有 Tool 的输入由公开 HTTP 暴露；本页 Job 程序是合成夹具原件。',
              'apps/service/src/message-response.ts',
            ],
            [
              '模型实际所见',
              'typed Inspector / 实际封存内容',
              '按原 Model ID、call 和 source 检查真实输入。失败呈现不改原机器回执，也不改旧封存输入；完整性错误不能用展示 fallback 吞掉。',
              'packages/agent/src/model-tools.README.md',
            ],
            [
              'Shell / Job 输出',
              '原输出序号与固定上界',
              'stdout / stderr / progress、丢失区间、真实停止确认。read / wait 成功只说明观察成功；不能变成目标 Job 成功。',
              'packages/agent/src/tools/shell.README.md',
            ],
            [
              '人工与 Auto',
              '准确原操作 / 精确 revision',
              '人工卡展示位置与来源不同；Auto 是内部 Model，不是 child。默认总预算 3000ms；超时交工具正常执行策略，原请求 filesystem／network 仍受父子与宿主硬边界约束，日志保 timeout，晚到不覆盖。判风险与授权不等于生成两份持久评分。',
              'packages/agent/src/permissions/README.md',
            ],
            [
              '原型数据与隐私',
              '本机合成项目 / 非生产 telemetry',
              '内置数据为已完成测试的只读证据。无 API key、请求 headers、bootstrap token 或 System prompt 导出；不会连接当前 Service、提交决定或执行导入命令。',
              'docs/active/observability-privacy-operations.md',
            ],
          ]
            .map(
              ([title, tag, text, path]) =>
                `<article class="card card-pad"><div class="row between"><h2>${title}</h2><span class="tag">${tag}</span></div><p class="small muted" style="margin:12px 0">${text}</p>${source(path)}</article>`,
            )
            .join(
              '',
            )}</div><section class="card card-pad" style="margin-top:16px"><h2>三组原始状态不能合成一个“已完成”</h2><table class="matrix" style="margin-top:12px"><tbody><tr><td>Command</td><td><code>accepted / applied / rejected / needs_review</code></td><td>受理和应用不是业务成功</td></tr><tr><td>Run</td><td><code>running / waiting_interaction / waiting_execution / cancelling / completed / failed / cancelled / interrupted</code></td><td>父普通完成不取消 child</td></tr><tr><td>Execution</td><td><code>planned / dispatching / running / succeeded / failed / cancelled / outcome_unknown</code></td><td>等待审核 / 资源是派生标签</td></tr></tbody></table></section><section class="card card-pad" style="margin-top:16px"><h2>这批实测能证明到哪里</h2><div class="summary-grid" style="margin-top:14px"><div class="summary-card card"><span class="small muted">测试请求记录</span><div class="value">433</div><p>gpt-6-luna / low；27个试次，含必要复验。</p></div><div class="summary-card card"><span class="small muted">失败 Tool 送达对应模型</span><div class="value">70 / 70</div><p>完整公开正文、call/source 均核到。送达不等于模型遵守。</p></div><div class="summary-card card"><span class="small muted">整体业务资格</span><div class="value" style="font-size:20px;color:var(--warn)">仍有实际问题</div><p>2026-11-03 历史试次中的误拦、绕过尝试、字段错误与未完成核验保留；不表示当前流程的实测结果。</p></div></div><div class="callout neutral" style="margin-top:14px">以上统计仅覆盖历史原报告。追加报告在日志工作台逐例保留Run、工具与业务断言状态；不并入旧统计，也不把历史缺项补成新实测。未自然触发的分支仍是源码／受控回归支持的推演。全工具目录亦不表示所有可选工具都在这批模型试验中启用。</div></section>`;
      }
      function render() {
        document.querySelectorAll('[data-view]').forEach((b) => {
          b.classList.toggle('active', b.dataset.view === state.view);
        });
        document.getElementById('mobile-nav').value = state.view;
        if (state.view === 'loop') renderLoop();
        else if (state.view === 'catalog') renderCatalog();
        else if (state.view === 'logs') renderLogs();
        else if (state.view === 'boundaries') renderBoundaries();
        else renderFlow(state.view === 'child', state.view === 'approval');
      }
      function setView(view) {
        stopPlaying();
        state.view = view;
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
      }
      async function copy(text) {
        try {
          await navigator.clipboard.writeText(text);
          toast('已复制原记录');
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.append(ta);
          ta.select();
          const ok = document.execCommand('copy');
          ta.remove();
          toast(ok ? '已复制原记录' : '浏览器未允许复制，请在原 JSON 中选择文本');
        }
      }
      document.querySelectorAll('[data-view]').forEach((b) => {
        b.onclick = () => setView(b.dataset.view);
      });
      document.getElementById('mobile-nav').onchange = (e) => setView(e.target.value);
      document.getElementById('import-btn').onclick = () =>
        document.getElementById('import-file').click();
      document.getElementById('import-file').onchange = async (event) => {
        const files = [...event.target.files];
        if (!files.length) return;
        try {
          const imported = [];
          const loose = {
            executions: [],
            models: [],
            logs: [],
            sessions: [],
            toolMessageReceipts: [],
            sourceMessageReceipts: [],
            approvals: [],
            jobOutput: {},
          };
          for (const file of files) {
            if (file.size > 30 * 1024 * 1024) throw Error('单文件超过30MB，请使用有限证据包');
            const parsed = JSON.parse(await file.text());
            if (!parsed || typeof parsed !== 'object')
              throw Error('需要证据对象、执行数组或 SessionLogPage，不能导入空值或普通文本');
            if (Array.isArray(parsed.cases)) {
              for (const c of parsed.cases) {
                if (
                  !Array.isArray(c.logs) ||
                  !Array.isArray(c.executions) ||
                  !Array.isArray(c.sessions)
                )
                  throw Error('证据包缺少 logs / executions / sessions');
                imported.push({
                  ...c,
                  id: 'import-' + Date.now() + '-' + imported.length,
                  title: '本地导入 · ' + (c.title || c.id || file.name),
                  origin: 'imported',
                });
              }
            } else if (Array.isArray(parsed) && parsed.every((x) => x.kind && x.definitionId)) {
              loose.executions.push(...parsed);
            } else if (Array.isArray(parsed.entries)) {
              loose.logs.push(...parsed.entries);
              if (parsed.sessionId)
                loose.sessions.push({ id: parsed.sessionId, parentSessionId: null });
            } else
              throw Error(
                '支持本页导出的证据包、evidence.json、executions.json或SessionLogPage；不把任意JSON猜成日志',
              );
          }
          if (loose.executions.length || loose.logs.length) {
            const ids = [
              ...new Set(
                [
                  ...loose.executions.map((e) => e.sessionId),
                  ...loose.logs.map((e) => e.sessionId),
                ].filter(Boolean),
              ),
            ];
            loose.sessions = ids.map((id) => ({
              id,
              parentSessionId: null,
              relationshipUnknown: true,
            }));
            imported.push({
              ...loose,
              id: 'import-' + Date.now(),
              title: '本地导入记录',
              mode: 'unknown',
              origin: 'imported',
              summary:
                '只导入了所选文件；未提供的模型输入、审批或事件正文保持不可用。来源关系未验证，不猜父子身份。',
              finding: '导入数据仅显示，不执行命令、不当作授权。',
              source: { files: files.map((f) => f.name) },
              omittedFields: ['未选择的原件'],
            });
          }
          if (!imported.length) throw Error('没有可导入的有限记录');
          for (const c of imported) {
            for (const key of [
              'logs',
              'executions',
              'sessions',
              'models',
              'toolMessageReceipts',
              'sourceMessageReceipts',
              'approvals',
            ]) {
              c[key] = c[key] ?? [];
              if (
                !Array.isArray(c[key]) ||
                c[key].some((x) => !x || typeof x !== 'object' || Array.isArray(x))
              )
                throw Error(key + ' 必须是记录数组');
            }
            if (
              c.logs.some(
                (x) =>
                  typeof x.sessionId !== 'string' ||
                  !/^\d+$/.test(String(x.cursor)) ||
                  typeof x.objectId !== 'string',
              )
            )
              throw Error('事件缺少有效 sessionId / cursor / objectId');
            if (c.executions.some((x) => typeof x.id !== 'string' || typeof x.kind !== 'string'))
              throw Error('执行缺少有效 id / kind');
            if (c.sessions.some((x) => typeof x.id !== 'string'))
              throw Error('Session 缺少有效 id');
            if (
              c.models.some((m) =>
                ['toolCalls', 'emittedToolCalls'].some(
                  (key) =>
                    m[key] != null &&
                    (!Array.isArray(m[key]) || m[key].some((x) => !x || typeof x !== 'object')),
                ),
              )
            )
              throw Error('模型工具调用必须是对象数组');
            if (
              (c.sourceMessageReceipts || []).some(
                (r) =>
                  typeof r.sourceId !== 'string' ||
                  typeof r.carrierExecutionId !== 'string' ||
                  !Array.isArray(r.receivedBy) ||
                  r.receivedBy.some((id) => typeof id !== 'string') ||
                  (r.receptions != null &&
                    (!Array.isArray(r.receptions) ||
                      r.receptions.some((entry) => !entry || typeof entry !== 'object'))),
              )
            )
              throw Error('Source缺少有效身份／接收模型数组');
            if (
              c.toolMessageReceipts.some(
                (x) => x.receivedBy != null && !Array.isArray(x.receivedBy),
              )
            )
              throw Error('receivedBy 必须是数组');
            c.jobOutput = c.jobOutput || {};
            if (typeof c.jobOutput !== 'object' || Array.isArray(c.jobOutput))
              throw Error('jobOutput 必须是对象');
          }
          data.cases.push(...imported);
          clearLogFocus();
          state.caseId = imported[0].id;
          state.executionFocus = null;
          state.evidenceContext = null;
          state.executionFocus = null;
          state.showDemo = false;
          state.logId = null;
          state.session = 'all';
          state.category = 'all';
          state.query = '';
          state.eventFilter = 'all';
          state.page = 0;
          setView('logs');
          toast('本地导入完成；没有联网或执行任何内容');
        } catch (error) {
          toast('导入失败：' + error.message);
        } finally {
          event.target.value = '';
        }
      };
      document.getElementById('export-btn').onclick = () => {
        const c = selectedCase();
        if (!c) {
          toast('没有当前记录');
          return;
        }
        const selected = filteredLogs(c);
        const bundle = {
          format: 'kite-execution-prototype',
          exportedAt: new Date().toISOString(),
          qualification: '本地只读原型导出；不是授权或实时日志连接',
          cases: [{ ...c, logs: selected }],
        };
        const url = URL.createObjectURL(new Blob([json(bundle)], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = 'execution-evidence-view.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 500);
        toast('已导出当前筛选事件及关联证据；不改变原记录');
      };
      window.addEventListener('resize', () => requestAnimationFrame(drawEdges));
      render();
      window.__prototypeInspect = () => ({
        view: state.view,
        mode: state.mode,
        family: state.family,
        loopScenario: state.loopScenario,
        loopActor: state.loopActor,
        flowView: currentFlowView,
        edges: currentEdges,
        nodeFacts: currentFlow.map((n) => ({
          id: n.id,
          raw: n.raw,
          recordKind: n.recordKind,
          derived: n.derived,
        })),
        nodes: currentFlow.map((n) => n.id),
        step: state.step,
        cases: data.cases.map((c) => ({
          id: c.id,
          logs: c.logs.length,
          executions: c.executions.length,
          sources: (c.sourceMessageReceipts || []).length,
        })),
        selectedLog: state.logId,
      });
    })();
    </script>
  </body>
</html>
