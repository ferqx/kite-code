schema_version = "1.3"
artifacts = ["/app/answer.txt"]

[task]
name = "kite/real-cli-file-smoke"
description = "Real Kite CLI, default Service and native Files with a deterministic local provider; not a real-model benchmark."
authors = []
keywords = ["kite", "harbor", "adapter", "smoke"]

[metadata]
difficulty = "easy"
category = "programming"
tags = ["mock-provider", "real-kite", "separate-verifier"]

[verifier]
timeout_sec = 60.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
mcp_servers = []

[agent]
# Launcher deadline 120s + cleanup <=42s; adapter preparation/report overhead <=35s.
timeout_sec = 240.0

[environment]
network_mode = "no-network"
build_timeout_sec = 1200.0
docker_image = "kite-harbor-smoke:local"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]
