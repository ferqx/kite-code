pre-commit:
  commands:
    protected-branch:
      run: bun run check:protected-branch
    docs-impact:
      run: bun run check:docs-impact --scope=staged
    format:
      glob: "*.{ts,tsx,json,jsonc,yml,yaml}"
      run: node node_modules/@biomejs/biome/bin/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: node node_modules/typescript/bin/tsc --noEmit
    core-boundary:
      glob: "*.{ts,tsx}"
      run: bun run check:core-boundary
    golden:
      glob: "*.{ts,tsx,json}"
      run: bun test tests/golden/
    plan-evidence:
      glob: "{release/oss-first-release/**,scripts/check-plan-execution-matrix.ts,docs/active/open-source-first-release.md,docs/adr/0069-first-release-terminal-scope.md}"
      run: bun run check:plan-evidence
    docs:
      glob: "*.{md,json,ts}"
      run: bun run check:docs
