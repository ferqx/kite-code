[package]
name = "kite-files-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
napi = { version = "=3.14.2", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Security",
  "Win32_Security_Authorization", "Win32_Storage_FileSystem",
  "Win32_System_Threading", "Win32_System_IO", "Win32_System_Memory",
  "Wdk_Foundation", "Wdk_Storage_FileSystem",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
